spring.application.name=backend

app.upload.image-dir=${APP_UPLOAD_IMAGE_DIR:C:\\Users\\Lenovo\\Desktop\\BS\\final\\image-manager-system\\image}
app.upload.thumbnail-dir=${APP_UPLOAD_THUMBNAIL_DIR:C:\\Users\\Lenovo\\Desktop\\BS\\final\\image-manager-system\\thumbnail}

# ?????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=${java.io.tmpdir}
spring.servlet.multipart.resolve-lazily=false

# Tomcat??
server.tomcat.max-swallow-size=1024MB
server.tomcat.max-http-header-size=65536
server.tomcat.connection-timeout=60000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.type-aliases-package=com.imageplatform.entity
mybatis.mapper-locations=classpath:mapper/*.xml

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/picturemanager?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=user
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5